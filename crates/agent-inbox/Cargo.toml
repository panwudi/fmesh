[package]
name = "agent-inbox"
version = "0.11.0"
edition = "2024"
license.workspace = true
description = "Deliver coordination messages to running agent sessions"

[features]
dynamic-peers = ["dep:base64", "dep:ring", "dep:socket2", "dep:x25519-dalek"]

[dependencies]
base64 = { version = "0.22", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
httparse = "1.10"
libc = "0.2"
ring = { version = "0.17", optional = true }
socket2 = { version = "0.6", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
subtle = { version = "2.6", default-features = false }
toml = { version = "0.8", default-features = false, features = ["parse"] }
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets", "zeroize"], optional = true }

[package]
name = "fmesh-core"
description = "fMesh view model: meshd status, device labels and the agent directory, shared by the CLI and the desktop"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
# Already used by meshtray and agent-inbox; serde derive gives the CLI a stable JSON shape.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

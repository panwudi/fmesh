[package]
name = "fmesh-desktop"
description = "fMesh device and agent list: one native Slint window for macOS and Windows, launched on demand"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
fmesh-core = { path = "../fmesh-core" }
# Slint (owner's call, 2026-10-25: the list must look good on macOS and Windows). Used under its
# GPL-3.0 option, compatible with this project's AGPL-3.0. Software renderer only: 58 MB footprint
# against 85 MB with OpenGL (measured 2026-10-25), same look for a list. No webview.
slint = { version = "1.18.1", default-features = false, features = ["std", "backend-default", "renderer-software", "accessibility", "compat-1-2"] }

[build-dependencies]
slint-build = "1.18.1"
